<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Your Cart - SpringCart</title>

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" th:href="@{/assets/online-shopping.png}" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link th:href="@{/css/style.css}" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; }

        #cart-page-container { min-height: 70vh; }

        .cart-card {
            background: #ffffff;
            border-radius: 14px;
            padding: 1.2rem;
            box-shadow: 0 4px 18px rgba(0,0,0,0.08);
            transition: 0.25s;
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .cart-card:hover { transform: translateY(-2px); }

        .cart-item-img {
            width: 130px;
            height: 130px;
            object-fit: contain;
            border-radius: 10px;
            background: #f8f9fa;
        }

        .qty-box {
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid #dce3e8;
            padding: 4px 10px;
            border-radius: 8px;
            width: fit-content;
            margin-top: 6px;
        }
        .qty-box button {
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            font-weight: 600;
        }
        .qty-box input {
            width: 40px;
            border: none;
            text-align: center;
            font-weight: 600;
            background: transparent;
        }

        .checkout-box {
            background: #fff;
            padding: 1.7rem;
            border-radius: 14px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }
    </style>
</head>

<body>

<!-- NAVBAR FRAGMENT - Reusable navigation bar from fragments folder -->
<div th:replace="fragments/navbar :: navbar"></div>

<!-- CART CONTENT -->
<main id="cart-page-container" class="container py-5">
    <div class="row">
        <div class="col-lg-8">
            <h2 class="mb-4">Your Cart</h2>

            <!-- Empty state -->
            <div id="cart-empty" class="text-center text-muted mb-4 d-none">
                <p>Your cart is empty.</p>
            </div>

            <!-- Cart items will be injected here -->
            <div id="cart-items" class="d-grid gap-3">
                <!-- ...existing code populates this element via JS... -->
            </div>
        </div>

        <div class="col-lg-4">
            <div id="checkout-box-wrapper" class="checkout-box d-none">
                <h5 class="fw-bold">Order Summary</h5>
                <hr>
                <div class="d-flex justify-content-between mb-3">
                    <div>Subtotal</div>
                    <div id="grand-total" class="fw-bold">$0.00</div>
                </div>
                <a href="/order-details" class="btn btn-primary w-100">Proceed to Checkout</a>
            </div>
        </div>
    </div>
</main>
<div th:replace="fragments/footer :: whyChooseUs"></div>
<!-- FOOTER FRAGMENT - Reusable footer from fragments folder -->
<div th:replace="fragments/footer :: footer"></div>

<!-- Bootstrap Bundle JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Custom JavaScript - Cart logic -->
<script>
    const API_BASE = window.location.origin + "/api";

    async function loadCart() {
        const cartItemsDiv = document.getElementById("cart-items");
        const emptyState = document.getElementById("cart-empty");
        const checkoutWrapper = document.getElementById("checkout-box-wrapper");
        const totalDisplay = document.getElementById("grand-total");

        cartItemsDiv.innerHTML = "";

        try {
            const res = await fetch(`${API_BASE}/cart`, { credentials: 'include' });
            if (!res.ok) throw new Error('Failed to load cart');
            const items = await res.json();

            if (!items || items.length === 0) {
                emptyState.classList.remove('d-none');
                checkoutWrapper.classList.add('d-none');
                updateCartBadge(0);
                return;
            }

            emptyState.classList.add('d-none');
            checkoutWrapper.classList.remove('d-none');

            let total = 0;

            items.forEach(item => {
                const subtotal = (item.product?.price || 0) * (item.quantity || 0);
                total += subtotal;

                const col = document.createElement('div');
                col.className = 'cart-card mb-3';

                col.innerHTML = `
                  <img src="${API_BASE}/product/${item.product.id}/image" class="cart-item-img" alt="${item.product.name}" onerror="this.src='https://dummyimage.com/450x300/dee2e6/6c757d.jpg'">
                  <div class="flex-grow-1">
                    <h5 class="fw-semibold mb-1">${item.product.name}</h5>
                    <div class="qty-box">
                      <button onclick="updateQty(${item.product.id}, ${item.quantity - 1})">−</button>
                      <input readonly value="${item.quantity}">
                      <button onclick="updateQty(${item.product.id}, ${item.quantity + 1})">+</button>
                    </div>
                  </div>
                  <div class="fw-bold fs-5 text-primary">$${subtotal.toFixed(2)}</div>
                  <button class="btn btn-sm btn-outline-danger" onclick="removeItem(${item.product.id})">Remove</button>
                `;

                cartItemsDiv.appendChild(col);
            });

            totalDisplay.textContent = `$${total.toFixed(2)}`;
            updateCartBadge(items.length);
        } catch (e) {
            console.error('Fetch error:', e?.message || e);
            cartItemsDiv.innerHTML = `<p class="text-center text-danger">Failed to load products.</p>`;
        }
    }

    async function updateQty(productId, newQty) {
        if (newQty < 1) return;
        await fetch(`${API_BASE}/cart/update?productId=${productId}&quantity=${newQty}`, { method: 'PUT', credentials: 'include' });
        loadCart();
    }

    async function removeItem(productId) {
        if (!confirm("Remove this item?")) return;
        await fetch(`${API_BASE}/cart/remove/${productId}`, { method: 'DELETE', credentials: 'include' });
        loadCart();
    }

    function updateCartBadge(count) {
        const badge = document.getElementById('cart-badge');
        if (badge) badge.textContent = count;
    }

    document.addEventListener('DOMContentLoaded', loadCart);
</script>
<script>
    window.CART_PAGE = true;
</script>

<!-- Universal app logic (cart, auth, search, etc.) -->
<script th:src="@{/js/app.js}" defer></script>

</body>
</html>
