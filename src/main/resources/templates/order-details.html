<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Order Details - SpringCart</title>

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" th:href="@{/assets/online-shopping.png}" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <style>
        /* --- Order Details Page Specific CSS --- */
        body { background: var(--bg-light2,#f8faff); font-family: 'Inter', sans-serif; }
        .order-details-container {
            margin: 40px auto;
            max-width: 700px;
            background: var(--white,#fff);
            border-radius: 18px;
            box-shadow: 0 6px 20px rgba(59, 93, 80, 0.10);
            padding: 32px;
        }
        .order-title {
            font-size: 2.3rem;
            font-weight: 800;
            letter-spacing: .5px;
            color: var(--primary-color,#2188ff);
            text-align: center;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .order-title i {
            color: var(--primary-color,#2188ff);
            font-size: 2.3rem;
        }
        .order-details-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 32px;
            background: transparent;
            border-radius: 12px 12px 0 0;
            overflow: hidden;
            box-shadow: 0 2px 6px rgba(50,120,230,0.04);
        }
        .order-details-table th,
        .order-details-table td {
            text-align: left;
            padding: 14px 12px;
            font-size: 1.13rem;
            color: var(--text-dark,#38404c);
            border-bottom: 1px solid #eee;
            background: transparent;
        }
        .order-details-table th {
            font-weight: 700;
            background: var(--bg-light,#f0f4f9);
            color: var(--primary-color,#2188ff);
        }
        .order-product-thumb {
            width: 70px; height: 70px;
            border-radius: 8px;
            object-fit: cover;
            box-shadow: 0 3px 8px rgba(0,0,0,0.07);
            margin-right: 14px;
            border: 1.5px solid #ececec;
        }
        .order-product-name {
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--primary-color,#2188ff);
        }
        .order-details-table .btn,
        .order-details-table [role="button"],
        .order-details-table .quantity-control {
            display: none !important;
        }
        .order-summary {
            background: var(--bg-light,#f0f4f9);
            border-radius: 1rem;
            box-shadow: 0 4px 16px rgba(80,130,200,0.06);
            padding: 24px 18px 5px;
            margin-top: 8px;
        }
        .order-summary-row {
            display: flex;
            justify-content: space-between;
            font-size: 1.09rem;
            padding: 8px 0;
        }
        .order-summary-row span:last-child {
            font-variant-numeric: tabular-nums;
        }
        .order-summary-row.order-summary-total {
            font-size: 1.23rem;
            font-weight: 700;
            color: var(--secondary-color,#25bc96);
            border-top: 1.2px solid #e0e0e0;
            padding-top: 16px;
            margin-top: 10px;
        }
        .btn-pay {
            width: 100%;
            padding: 14px;
            margin-top: 26px;
            font-size: 1.18rem;
            border-radius: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: linear-gradient(93deg, #2188ff 60%, #43cea2 110%);
            color: #fff;
            box-shadow: 0 6px 16px rgba(33,136,255,0.11);
            border: none;
            transition: background .18s;
        }
        .btn-pay:hover {
            background: linear-gradient(93deg, #43cea2 70%, #2188ff 120%);
            color: #fff;
        }
        @media (max-width: 600px) {
            .order-details-container {padding: 10px;}
            .order-details-table th, .order-details-table td {padding: 7px 5px;}
            .order-product-thumb {width: 46px; height: 46px;}
            .order-title { font-size: 1.45rem; }
            .order-summary {padding: 11px 7px 4px;}
            .btn-pay {font-size: 1rem;}
        }
    </style>
</head>
<body>
<!-- Universal Navbar fragment -->
<div th:replace="fragments/navbar :: navbar"></div>

<div class="order-details-container">

    <div class="order-title">
        <i class="bi bi-bag-check-fill"></i> Order Details
    </div>
    <div class="table-responsive">
        <table class="order-details-table">
            <thead>
            <tr>
                <th>Product</th>
                <th>Name</th>
                <th>Price</th>
                <th>Qty</th>
                <th>Total</th>
            </tr>
            </thead>
            <tbody id="order-items"></tbody>
        </table>
    </div>
    <div class="order-summary">
        <div class="order-summary-row"><span>Subtotal</span><span id="summary-subtotal">₹0.00</span></div>
        <div class="order-summary-row"><span>Delivery Fee</span><span id="summary-delivery">₹59.00</span></div>
        <div class="order-summary-row"><span>Platform Fee</span><span id="summary-platform">₹12.00</span></div>
        <div class="order-summary-row"><span>Discount Applied</span><span id="summary-discount">-₹0.00</span></div>
        <div class="order-summary-row order-summary-total"><span>Grand Total</span><span id="summary-grand">₹0.00</span></div>
        <button class="btn-pay" id="btn-proceed">
            <i class="bi bi-credit-card"></i> Proceed to Payment
        </button>
    </div>
</div>

<!-- Universal Footer fragment -->
<div th:replace="fragments/footer :: footer"></div>

<!-- Bootstrap Bundle JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- Universal Custom JS -->
<script th:src="@{/js/app.js}" defer></script>
<script>
    function INR(v){ return '₹' + (v||0).toFixed(2); }
    function loadOrderDetails(){
        fetch('/api/orderdetails').then(r=>r.json()).then(items=>renderOrder(items));
    }
    function renderOrder(items){
        let t = document.getElementById('order-items');
        t.innerHTML = '';
        let subtotal = 0;
        items.forEach(i=>{
            let tot = i.product.price * i.quantity; subtotal += tot;
            t.innerHTML += `<tr>
                <td><img src="/api/product/${i.product.id}/image" class="order-product-thumb"></td>
                <td class="order-product-name">${i.product.name}</td>
                <td>${INR(i.product.price)}</td>
                <td>${i.quantity}</td>
                <td>${INR(tot)}</td>
            </tr>`;
        });
        let d=59, p=12, disc=subtotal>50000?500:0, grand=subtotal+d+p-disc;
        document.getElementById('summary-subtotal').textContent=INR(subtotal);
        document.getElementById('summary-delivery').textContent=INR(d);
        document.getElementById('summary-platform').textContent=INR(p);
        document.getElementById('summary-discount').textContent='-'+INR(disc);
        document.getElementById('summary-grand').textContent=INR(grand);
    }
    document.addEventListener('DOMContentLoaded', loadOrderDetails);
    // document.getElementById('btn-proceed').addEventListener('click', ()=>alert('Proceeding to Payment...'));
</script>
<script>
    window.APP_USER_ID = [[${userId}]];
</script>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script src="/js/razorpay.js"></script>

</body>
</html>
