<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>New Arrivals - SpringCart</title>

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" th:href="@{/assets/online-shopping.png}" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" />

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" />

    <!-- Universal CSS - Same as index.html (includes Furni style) -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<!-- NAVBAR FRAGMENT - Reusable navigation bar -->
<div th:replace="fragments/navbar :: navbar"></div>

<!-- HERO SECTION - New Arrivals hero (uses Furni hero style from style.css) -->
<div class="hero">
    <div class="container">
        <div class="row justify-content-between align-items-center">
            <div class="col-lg-5">
                <div class="intro-excerpt">
                    <h1>New Arrivals</h1>
                    <p class="mb-4">Discover the latest products in our exclusive collection!</p>
                    <p>
                        <a href="#products" class="btn btn-secondary me-2">Browse New Arrivals</a>
                        <a th:href="@{/}" class="btn btn-white-outline">View All Products</a>
                    </p>
                </div>
            </div>
            <div class="col-lg-7">
                <div class="hero-img-wrap">
                    <!-- Hero image for New Arrivals -->
                    <img src="https://images.unsplash.com/photo-1441986300917-64674bd600d8?auto=format&fit=crop&w=1200&q=80"
                         class="img-fluid rounded-3 shadow-lg"
                         alt="New Arrivals" />
                </div>
            </div>
        </div>
    </div>
</div>

<!-- PRODUCTS SECTION - Display NEW products only -->
<section class="product-section py-5" id="products">
    <div class="container px-4 px-lg-5 mt-5">
        <h2 class="section-title text-center fw-bolder mb-5" id="productsTitle">New Arrivals</h2>
        <div class="row gx-4 gx-lg-5 row-cols-2 row-cols-md-3 row-cols-xl-4 justify-content-center product-grid" id="newArrivalGrid">
            <!-- Dynamic NEW products will be inserted here by JavaScript -->
        </div>
    </div>
</section>

<!-- WHY CHOOSE US SECTION - Reusable fragment -->
<div th:replace="fragments/footer :: whyChooseUs"></div>

<!-- FOOTER FRAGMENT - Reusable footer -->
<div th:replace="fragments/footer :: footer"></div>

<!-- Bootstrap Bundle JS - Required for dropdowns -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Universal JavaScript - Auth, cart badge, common functionality -->
<script th:src="@{/js/app.js}" defer></script>

<!-- PAGE-SPECIFIC JAVASCRIPT - Fetch NEW arrivals only -->
<script th:src="@{/js/new-arrivals.js}" defer></script>

</body>
</html>
