<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Payment Failed - SpringCart</title>

    <link rel="icon" type="image/x-icon" th:href="@{/assets/online-shopping.png}" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f8faff;
            font-family: 'Inter', sans-serif;
        }
        .fail-container {
            max-width: 600px;
            margin: 50px auto;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.08);
            text-align: center;
        }
        .fail-icon {
            font-size: 70px;
            color: #e63946;
        }
        .fail-title {
            font-size: 2rem;
            margin-top: 10px;
            font-weight: 700;
            color: #e63946;
        }
        .fail-message {
            font-size: 1.2rem;
            margin-top: 10px;
            color: #555;
        }
        .back-btn {
            margin-top: 25px;
            padding: 12px 22px;
            font-size: 1.1rem;
            background-color: #2188ff;
            border-radius: 12px;
            color: white;
            border: none;
            text-decoration: none;
        }
        .back-btn:hover {
            background-color: #136fe0;
            color: white;
        }
    </style>
</head>
<body>

<div class="fail-container">
    <div class="fail-icon">❌</div>

    <div class="fail-title">Payment Failed</div>

    <p class="fail-message">
        Unfortunately, your payment could not be processed.<br>
        Please try again or use a different payment method.
    </p>

    <a href="/order-details" class="back-btn">Try Again</a>
</div>

</body>
</html>
