<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Payment Success - SpringCart</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Fonts for more polished look -->
    <link href="https://fonts.googleapis.com/css?family=Inter:400,600&display=swap" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(120deg, #e6ffe6 0%, #d4fae5 100%);
            font-family: 'Inter', 'Segoe UI', sans-serif;
            min-height: 100vh;
        }
        .success-box {
            max-width: 450px;
            margin: 80px auto;
            padding: 40px 32px 32px 32px;
            background: #fff;
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(38, 167, 94, 0.13), 0 1.5px 5px rgba(0,0,0,0.06);
            text-align: center;
            transition: box-shadow 0.2s;
        }
        .success-anim-tick {
            margin: 0 auto 10px;
            display: block;
            width: 90px;
            height: 90px;
        }
        .order-id {
            font-size: 1.08rem;
            margin-top: 14px;
            font-weight: 600;
            color: #17863e;
            letter-spacing: 0.2px;
            background: #e6ffe9;
            display: inline-block;
            padding: 8px 18px;
            border-radius: 16px;
            box-shadow: 0 1.5px 5px rgba(38, 167, 94, 0.08);
            margin-bottom: 10px;
        }
        .btn-home {
            margin-top: 26px;
            padding: 13px 32px;
            font-size: 1.08rem;
            border-radius: 14px;
            box-shadow: 0 3px 14px #28a7451f;
            font-weight: 600;
            background: linear-gradient(90deg, #2ddb7f 60%, #29b66b 100%);
            border: none;
            transition: background 0.16s;
        }
        .btn-home:hover, .btn-home:focus {
            background: linear-gradient(90deg, #29b66b 60%, #01924d 100%);
        }
        h2 {
            font-size: 2rem;
            font-weight: 700;
            color: #1c6033;
            margin-top: 1.2rem;
            letter-spacing: 0.3px;
        }
        .text-muted {
            margin-bottom: 18px;
        }
        @media (max-width: 575px) {
            .success-box {
                padding: 32px 8vw 24px 8vw;
            }
        }
        /* SVG Tick Animation */
        .checkmark__circle {
            stroke-dasharray: 240;
            stroke-dashoffset: 240;
            stroke: #2ddb7f;
            stroke-width: 6;
            fill: none;
            animation: circle-animate 0.7s ease-out forwards;
        }
        .checkmark__check {
            stroke-dasharray: 75;
            stroke-dashoffset: 75;
            stroke: #2ddb7f;
            stroke-width: 6;
            fill: none;
            animation: check-animate 0.35s 0.55s cubic-bezier(.31,.93,.6,1.22) forwards;
        }
        @keyframes circle-animate {
            to {stroke-dashoffset: 0;}
        }
        @keyframes check-animate {
            to {stroke-dashoffset: 0;}
        }
    </style>
</head>
<body>
<div class="success-box">
    <!-- Green tick animation (SVG) -->
    <svg class="success-anim-tick" viewBox="0 0 64 64">
        <circle class="checkmark__circle" cx="32" cy="32" r="28"/>
        <polyline class="checkmark__check" points="19.7,34.9 29.7,44 45,24.5"/>
    </svg>

    <h2>Payment Successful!</h2>
    <p class="text-muted fs-5">Thank you for shopping with <span style="color:#27b366;font-weight:600;">SpringCart</span>.</p>

    <div class="order-id">
        Your Order ID: <span th:text="${orderId}">12345</span>
    </div>

    <a href="/" class="btn btn-success btn-home">Go to Home</a>
</div>

<!-- Optionally add a gentle fade-in for the box with JavaScript -->
<script>
    window.onload = function() {
        document.querySelector('.success-box').style.opacity = 0;
        setTimeout(() => {
            document.querySelector('.success-box').style.transition = 'opacity 0.6s cubic-bezier(.31,.93,.6,1.22)';
            document.querySelector('.success-box').style.opacity = 1;
        }, 200);
    };
</script>
</body>
</html>
