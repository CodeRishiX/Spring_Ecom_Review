<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Payment Success - SpringCart</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css?family=Inter:400,600&display=swap" rel="stylesheet">

    <style>
        body {
            /* Soft green background gradient */
            background: linear-gradient(120deg, #e6ffe6 0%, #d4fae5 100%);
            font-family: 'Inter', 'Segoe UI', sans-serif;
            min-height: 100vh;
        }
        .loader-wrap, .success-box {
            max-width: 420px;
            margin: 78px auto;
            display: block;
        }

        /* Loader Styles */
        .loader {
            margin: 42px auto 18px auto;
            display: block;
            width: 54px;
            height: 54px;
            border: 6px solid #e4f7ec;
            border-top: 6px solid #28a745;
            border-radius: 50%;
            animation: spin-loader 0.7s linear infinite;
        }
        @keyframes spin-loader {
            100% { transform: rotate(360deg); }
        }
        .processing-msg {
            color: #298c53;
            font-size: 1.15rem;
            font-weight: 500;
            text-align: center;
            letter-spacing: 0.03em;
            margin-bottom: 7px;
        }

        /* Success Box Styles (as before, with aesthetic upgrades) */
        .success-box {
            background: #fff;
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(38, 167, 94, 0.15), 0 1.5px 5px rgba(0,0,0,0.06);
            text-align: center;
            padding: 36px 30px 32px 30px;
            display: none;
            opacity: 0;
            transition: opacity 0.45s cubic-bezier(.31,.93,.6,1.22);
        }

        .success-anim-tick {
            margin: 0 auto 10px;
            display: block;
            width: 80px;
            height: 80px;
        }
        .order-id {
            font-size: 1.11rem;
            font-weight: 600;
            color: #17863e;
            letter-spacing: 0.18px;
            background: #e6ffe9;
            padding: 8px 18px;
            border-radius: 16px;
            display: inline-block;
            margin-bottom: 8px;
            box-shadow: 0 1.5px 5px #28a74511;
        }
        .btn-home {
            margin-top: 28px;
            padding: 13px 32px;
            font-size: 1.09rem;
            border-radius: 14px;
            font-weight: 600;
            background: linear-gradient(90deg, #2ddb7f 60%, #29b66b 100%);
            border: none;
            transition: background 0.2s;
            box-shadow: 0 3px 13px #28a7452f;
        }
        .btn-home:hover, .btn-home:focus {
            background: linear-gradient(90deg, #29b66b 60%, #01924d 100%);
        }
        h2 {
            font-size: 2rem;
            font-weight: 700;
            color: #1c6033;
            margin-top: 1.2rem;
            letter-spacing: 0.3px;
        }
        .text-muted {
            margin-bottom: 18px;
        }
        @media (max-width: 575px) {
            .success-box, .loader-wrap {
                padding: 32px 10vw 24px 10vw;
                max-width: 99vw;
            }
        }
        /* SVG Tick Animation */
        .checkmark__circle {
            stroke-dasharray: 240;
            stroke-dashoffset: 240;
            stroke: #2ddb7f;
            stroke-width: 6;
            fill: none;
            animation: circle-animate 0.7s ease-out forwards;
        }
        .checkmark__check {
            stroke-dasharray: 75;
            stroke-dashoffset: 75;
            stroke: #2ddb7f;
            stroke-width: 6;
            fill: none;
            animation: check-animate 0.35s 0.55s cubic-bezier(.31,.93,.6,1.22) forwards;
        }
        @keyframes circle-animate {
            to {stroke-dashoffset: 0;}
        }
        @keyframes check-animate {
            to {stroke-dashoffset: 0;}
        }
    </style>
</head>
<body>
<!-- Loader (shown first) -->
<div class="loader-wrap" id="loaderCover">
    <div class="loader"></div>
    <div class="processing-msg">Confirming  Payment...</div>
</div>
<!-- Success Box (shown after tiny delay) -->
<div class="success-box" id="successCover">
    <svg class="success-anim-tick" viewBox="0 0 64 64">
        <circle class="checkmark__circle" cx="32" cy="32" r="28"/>
        <polyline class="checkmark__check" points="19.7,34.9 29.7,44 45,24.5"/>
    </svg>
    <h2>Order Placed  Successfully!</h2>
    <p class="text-muted fs-5">Thank you for shopping with <span style="color:#27b366;font-weight:600;">SpringCart</span>.</p>
    <div class="order-id">
        Your Order ID: <span th:text="${orderId}">12345</span>
    </div>
    <a href="/" class="btn btn-success btn-home">Go to Home</a>
</div>

<!-- JS to handle loader transition -->
<script>
    window.onload = function() {
        // Show loader for 1 second, then switch to success box instantly
        setTimeout(function() {
            document.getElementById('loaderCover').style.display = "none";
            let successCover = document.getElementById('successCover');
            successCover.style.display = "block";
            setTimeout(function() {successCover.style.opacity = 1}, 10);
        }, 1000); // adjust delay here for perceived speed
    };
</script>
</body>
</html>
