<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Order Details - SpringCart</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Lottie -->
    <script src="https://unpkg.com/lottie-web@5.9.6/build/player/lottie.min.js"></script>

    <!-- Global + page CSS -->
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <link th:href="@{/css/order-details.css}" rel="stylesheet">
</head>
<body>
<!-- navbar -->
<div th:replace="fragments/navbar :: navbar"></div>

<main class="container py-5">
    <div class="order-details-card shadow-sm rounded-4 p-4">
        <div class="d-flex align-items-center justify-content-between mb-3">
            <h3 class="mb-0"><i class="bi bi-receipt-cutoff me-2"></i>Order Details</h3>
            <div>
                <button id="btn-download-invoice" class="btn btn-outline-primary me-2">
                    <i class="bi bi-download me-1"></i> Download Invoice
                </button>
                <a href="/orders" class="btn btn-light">Back to orders</a>
            </div>
        </div>

        <div id="order-info" class="mb-3"></div>

        <hr>

        <h5 class="mb-3">Items</h5>
        <div id="order-items" class="mb-3"></div>

        <div class="text-end mt-3">
            <div class="h5">Grand Total: <span id="order-total" class="text-primary"></span></div>
        </div>

        <!-- lottie containers -->
        <div class="d-flex gap-3 mt-4">
            <div id="lottie-success" class="lottie-box d-none"></div>
            <div id="lottie-fail" class="lottie-box d-none"></div>
        </div>
    </div>
</main>

<!-- footer -->
<div th:replace="fragments/footer :: footer"></div>

<!-- scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}" defer></script>
<script th:src="@{/js/Full-order-details.js}" defer></script>
</body>
</html>
