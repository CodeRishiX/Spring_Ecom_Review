<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="Update Product" />
    <meta name="author" content="" />
    <title>Update Product - Start Bootstrap</title>
    <!-- Favicon-->
    <link rel="icon" type="image/x-icon" th:href="@{/assets/online-shopping.png}" />
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" />
    <!-- Custom CSS -->
    <link th:href="@{/css/style.css}" rel="stylesheet" />

    <!-- Inline CSS for modern styling -->
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #f8fafc 0%, #e3e9f3 40%, #f7d9e3 80%, #c3e0f7 100%);
            background-attachment: fixed;
            animation: bgMove 18s ease-in-out infinite alternate;
        }
        @keyframes bgMove {
            0% {background-position: 0% 50%;}
            50% {background-position: 100% 50%;}
            100% {background-position: 0% 50%;}
        }
        .header {
            background:  linear-gradient(90deg, #466a5d 0%, #3c5d51 100%);
            color: #fff;
            border-radius: 0 0 30px 30px;
            box-shadow: 0 8px 32px rgba(44,62,80,0.15);
            position: relative;
            overflow: hidden;
        }
        .header::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(270deg, #2c3e50, #1a1a1a, #2c3e50, #1a1a1a);
            background-size: 400% 400%;
            opacity: 0.5;
            z-index: 0;
            animation: gradientMove 8s ease-in-out infinite;
        }
        @keyframes gradientMove {
            0% {background-position: 0% 50%;}
            50% {background-position: 100% 50%;}
            100% {background-position: 0% 50%;}
        }
        .header .container {
            position: relative;
            z-index: 1;
        }
        .header h1 {
            font-size: 3.5rem;
            font-weight: 800;
            letter-spacing: 2px;
            animation: fadeInDown 1.2s cubic-bezier(.77,0,.18,1) both;
        }
        .header p {
            font-size: 1.5rem;
            color: #e0e0e0;
            margin-bottom: 2rem;
            animation: fadeInUp 1.5s cubic-bezier(.77,0,.18,1) 0.5s both;
        }
        @keyframes fadeInDown {
            0% {opacity:0; transform:translateY(-40px);}
            100% {opacity:1; transform:translateY(0);}
        }
        @keyframes fadeInUp {
            0% {opacity:0; transform:translateY(40px);}
            100% {opacity:1; transform:translateY(0);}
        }
        .image-preview {
            max-width: 200px;
            border-radius: 8px;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>

<!-- NAVBAR FRAGMENT - Reusable navigation bar from fragments folder -->
<div th:replace="fragments/navbar :: navbar"></div>

<!-- Header -->
<header class="header py-5">
    <div class="container px-4 px-lg-5 my-5">
        <div class="text-center text-white">
            <h1 class="display-4 fw-bolder">Update Product</h1>
            <p class="lead fw-normal text-white-50 mb-0">Edit the product details below</p>
        </div>
    </div>
</header>
<!-- Form Section -->
<section class="py-5">
    <div class="container px-4 px-lg-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card p-4">
                    <h3 class="text-center mb-4">Product Details</h3>
                    <!-- Image Preview -->
                    <div class="mb-3 text-center">
                        <label class="form-label">check</label>
                        <img id="currentImage" class="image-preview" src="https://dummyimage.com/200x200/dee2e6/6c757d.jpg" alt="Current Product Image" />
                    </div>
                    <form id="updateProductForm" enctype="multipart/form-data">
                        <div class="mb-3">
                            <label for="brand" class="form-label">Brand</label>
                            <input type="text" class="form-control" id="brand" required />
                        </div>
                        <div class="mb-3">
                            <label for="category" class="form-label">Category</label>
                            <input type="text" class="form-control" id="category" required />
                        </div>
                        <div class="mb-3">
                            <label for="name" class="form-label">Product Name</label>
                            <input type="text" class="form-control" id="name" required />
                        </div>
                        <div class="mb-3">
                            <label for="description" class="form-label">Description</label>
                            <textarea class="form-control" id="description" rows="4"></textarea>
                        </div>
                        <div class="mb-3">
                            <label for="price" class="form-label">Price ($)</label>
                            <input type="number" step="0.01" class="form-control" id="price" required />
                        </div>
                        <div class="mb-3">
                            <label for="quantity" class="form-label">Quantity</label>
                            <input type="number" class="form-control" id="quantity" required />
                        </div>
                        <div class="mb-3">
                            <label for="releaseDate" class="form-label">Release Date</label>
                            <input type="date" class="form-control" id="releaseDate" required />
                        </div>
                        <div class="mb-3">
                            <label for="imageFile" class="form-label">Upload New Image (optional)</label>
                            <input type="file" class="form-control" id="imageFile" accept="image/*" />
                        </div>
                        <div class="form-check mb-4">
                            <input type="checkbox" class="form-check-input" id="available" checked />
                            <label class="form-check-label" for="available">Available</label>
                        </div>
                        <button type="submit" class="btn btn-primary w-100" id="updateBtn">Update Product</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>

<!-- FOOTER FRAGMENT - Reusable footer from fragments folder -->
<div th:replace="fragments/footer :: footer"></div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- Core theme JS -->
<script th:src="@{/js/scripts.js}"></script>

<!-- Form Submission Script and Role button visibility (unchanged, as in your original) -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
        fetch('http://localhost:8080/api/user/role', { credentials: 'include' })
            .then(res => {
                if (!res.ok) throw new Error('Unauthorized');
                return res.text();
            })
            .then(role => {
                if (role !== 'ROLE_ADMIN') {
                    document.querySelector('.card').style.display = 'none';
                }
            })
            .catch(() => {
                document.querySelector('.card').style.display = 'none';
            });

        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get('id');

        if (productId) {
            fetch(`http://localhost:8080/api/productdetails/${productId}`)
                .then(res => res.json())
                .then(product => {
                    document.getElementById('brand').value = product.brand || '';
                    document.getElementById('category').value = product.category || '';
                    document.getElementById('name').value = product.name || '';
                    document.getElementById('description').value = product.description || '';
                    document.getElementById('price').value = product.price || 0;
                    document.getElementById('quantity').value = product.quantity || 0;
                    document.getElementById('releaseDate').value = product.releaseDate ? new Date(product.releaseDate).toISOString().split('T')[0] : '';
                    document.getElementById('available').checked = product.available !== false;
                    document.getElementById('currentImage').src = `http://localhost:8080/api/product/${productId}/image`;
                    document.getElementById('currentImage').onerror = function () {
                        this.src = 'https://dummyimage.com/200x200/dee2e6/6c757d.jpg';
                    };
                })
                .catch(e => {
                    console.error('Fetch error:', e);
                    document.querySelector('.card').innerHTML = '<p class="text-center">Failed to load product details.</p>';
                });

            document.getElementById('updateProductForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const fd = new FormData();
                const product = {
                    id: parseInt(productId),
                    brand: document.getElementById('brand').value,
                    category: document.getElementById('category').value,
                    name: document.getElementById('name').value,
                    description: document.getElementById('description').value,
                    price: parseFloat(document.getElementById('price').value),
                    quantity: parseInt(document.getElementById('quantity').value),
                    releaseDate: document.getElementById('releaseDate').value,
                    available: document.getElementById('available').checked
                };
                fd.append('product', new Blob([JSON.stringify(product)], { type: 'application/json' }));
                const imageFile = document.getElementById('imageFile').files[0];
                if (imageFile) {
                    fd.append('imagefile', imageFile);
                }

                try {
                    const res = await fetch(`http://localhost:8080/api/productupdate/${productId}`, {
                        method: 'PUT',
                        body: fd,
                        credentials: 'include'
                    });
                    if (!res.ok) {
                        const errorText = await res.text();
                        throw new Error(errorText);
                    }
                    alert('✅ Product updated successfully!');
                    window.location.href = '/';
                } catch (err) {
                    console.error('Update error:', err.message);
                    alert('❌ Error: ' + err.message);
                }
            });
        } else {
            document.querySelector('.card').innerHTML = '<p class="text-center">No product ID provided.</p>';
        }
    });
</script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const signInButton = document.getElementById('signInButton');
        const userProfile = document.getElementById('userProfile');
        const userImage = document.getElementById('userImage');
        const userName = document.getElementById('userName');
        const adminBadge = document.getElementById('adminBadge');

        fetch('http://localhost:8080/api/auth/status', { credentials: 'include' })
            .then(response => response.json())
            .then(data => {
                if (data.authenticated) {
                    signInButton.classList.add('d-none');
                    userProfile.classList.remove('d-none');
                    userImage.src = data.imageUrl || 'https://via.placeholder.com/40';
                    userName.textContent = data.name;

                    fetch('http://localhost:8080/api/user/role', {
                        credentials: 'include',
                        headers: { "Accept": "text/plain" }
                    })
                        .then(res => res.text())
                        .then(role => {
                            if (role === "ROLE_ADMIN") {
                                adminBadge.classList.remove('d-none');
                                document.getElementById('userBadge').classList.add('d-none');
                            }
                        });
                } else {
                    signInButton.classList.remove('d-none');
                    userProfile.classList.add('d-none');
                }
            })
            .catch(error => console.error('Auth check failed:', error));
    });
</script>


<script>
    window.addEventListener("DOMContentLoaded", () => {
        fetch("http://localhost:8080/api/user/role", { credentials: "include" })
            .then(res => res.text())
            .then(role => {
                const isAdmin = role === "ROLE_ADMIN";
                const addBtn = document.getElementById("addProductBtn");
                const updateBtn = document.getElementById("updateBtn");
                const deleteBtn = document.getElementById("deleteBtn");

                if (addBtn) addBtn.style.display = isAdmin ? "block" : "none";
                if (updateBtn) updateBtn.style.display = isAdmin ? "inline-block" : "none";
                if (deleteBtn) deleteBtn.style.display = isAdmin ? "inline-block" : "none";
            })
            .catch(err => {
                console.error("Role check failed:", err);
            });
    });
</script>

</body>
</html>
